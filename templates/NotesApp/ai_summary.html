{% extends 'NotesApp/base.html' %}

{% block title %}AI Summary | {{ note.title }}{% endblock %}

{% block content %}

<section class="ai-summary">
    <h1>AI Summary</h1>
    <h2>{{ note.title }}</h2>

    <div class="summary-content">
        {{ summary|linebreaks }}
    </div>

    <a href="{% url 'note_detail' note.pk %}">Back to Note</a>
</section>

{% endblock %}
